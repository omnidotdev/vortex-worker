# Workflow Engine Services
#
# Default: Hatchet (dashboard at http://localhost:8888)
# Alternative: Temporal (uncomment below, comment out Hatchet)
#
# Hatchet credentials:
#   admin@example.com / Admin123!

services:
  # =============================================================================
  # HATCHET (default workflow engine)
  # =============================================================================

  hatchet:
    container_name: hatchet
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    ports:
      - "8888:8888"
      - "7077:7077"
    depends_on:
      hatchet-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://hatchet:hatchet@hatchet-db:5432/hatchet?sslmode=disable"
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_COOKIE_SECRETS: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8888
      SERVER_LOGGER_LEVEL: warn
      SERVER_LOGGER_FORMAT: console
      DATABASE_LOGGER_LEVEL: warn
      DATABASE_LOGGER_FORMAT: console
    volumes:
      - hatchet-rabbitmq-data:/var/lib/rabbitmq
      - hatchet-config:/config

  hatchet-db:
    container_name: hatchet-db
    image: postgres:15
    command: postgres -c 'max_connections=200'
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: hatchet
      POSTGRES_DB: hatchet
    volumes:
      - hatchet-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hatchet -U hatchet"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # =============================================================================
  # TEMPORAL (alternative workflow engine)
  # Uncomment below and comment out Hatchet to use Temporal instead
  # =============================================================================

